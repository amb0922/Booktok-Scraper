name: Monthly Goodreads Scrape

# Runs monthly, and can also be triggered manually from the "Actions" tab.
# Instagram and Reddit are explicitly turned off for this run \u2014 they
# have their own separate weekly workflow.
on:
  schedule:
    - cron: '0 6 1 * *'   # 6:00 AM UTC on the 1st of every month \u2014 change the day-of-month or hour as needed
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run scraper (Goodreads only)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENABLE_INSTAGRAM: 'false'
          ENABLE_REDDIT: 'false'
        run: node booktok-scraper.js

      - name: Commit updated dataset (only if it actually changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add curated-dataset.json
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "Auto-update curated dataset (monthly Goodreads) $(date -u +%Y-%m-%d)"
          # A run takes several minutes, so the repo may have gained new
          # commits since checkout (e.g. a manual file upload). Rebase onto
          # whatever's there now instead of failing the whole run, and retry
          # once in case of a second race.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed successfully on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - rebasing onto latest remote and retrying..."
            git pull --rebase --autostash origin main || exit 1
          done
          echo "Could not push after 3 attempts."
          exit 1
